name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Runs here rather than only through CodeFactor, which analyses pull requests
  # against the default branch and nothing else: the eight PRs stacked on the
  # 2.0 branch got no static analysis at all, and the first report came from
  # their accumulated diff. This gives every pull request the same check
  # whatever it targets.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` runs prepare -> tsc, so this also verifies the build.
      - run: npm ci
      # Offline suite only: no secrets, so this passes on fork PRs.
      - run: npm test

  api-surface:
    name: api surface
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      # Fails when the public API differs from etc/easy-currencies.api.md.
      # Regenerate with `npm run api:update` and commit the diff to approve it.
      - run: npm run api:check

      # The report says only THAT the API changed; show what, so a contributor
      # does not have to reproduce the toolchain to find out.
      - name: Show API diff
        if: failure()
        run: |
          echo "The public API changed. To accept it: npm run api:update, then commit etc/easy-currencies.api.md"
          git --no-pager diff --no-index --color=always \
            etc/easy-currencies.api.md temp/easy-currencies.api.md || true

      # A correct .api.md does not mean the published tarball resolves.
      # These check the artifact itself: packaging correctness, and TypeScript
      # module resolution under node10 / node16 / bundler.
      - run: npm run lint:package
      - run: npm run check:package
      # Neither of the above executes the package; this installs and imports it.
      - run: npm run smoke:pack

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Patch coverage diffs against the base branch, which needs history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run test:coverage

      # Renders the figures on the run page; `always()` so they still show when
      # the coverage threshold is what failed the job.
      - name: Coverage summary
        if: always()
        run: |
          node scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

      # Global coverage barely moves when a few uncovered lines are added, so
      # this gates the changed lines instead. Runs after the summary so the
      # figures are published even when this step fails the job.
      - name: Patch coverage
        if: always() && github.event_name == 'pull_request'
        # `shell: bash` sets pipefail; the default `bash -e` does not, so the
        # script's exit code would be swallowed by tee.
        shell: bash
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          node scripts/patch-coverage.js | tee -a "$GITHUB_STEP_SUMMARY"

      # Forks get a read-only token, so skip there rather than failing the job;
      # they still get the figures in the step summary above.
      - name: Comment coverage on PR
        if: >
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          node scripts/coverage-summary.js > coverage-comment.md
          node scripts/patch-coverage.js >> coverage-comment.md || true
          # Edit the previous comment instead of adding one per push.
          gh pr comment "$PR" --body-file coverage-comment.md --edit-last --create-if-none
